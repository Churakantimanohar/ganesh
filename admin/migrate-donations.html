<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Publish Donations - Reddy's Youth Associations</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar">

        <div class="nav-container">

            <div class="logo">
                <img class="brand-logo" src="../assets/logo.svg" alt="Reddy's Youth Associations logo">
                <span>Reddy's Youth Associations</span>
            </div>

            <div class="nav-links">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="manage-donations.html">
                    Manage Donations
                </a>

                <a href="../transparency.html">
                    Transparency
                </a>

                <a href="#" id="logoutBtn">
                    Logout
                </a>

            </div>

        </div>

    </nav>


    <main class="dashboard-container">

        <section class="dashboard-header">

            <h1>
                Publish Existing Donations
            </h1>

            <p>
                Publish existing confirmed donations to the public transparency page.
            </p>

        </section>


        <section class="dashboard-section">

            <div class="form-card">

                <div class="form-group">

                    <label for="festivalYear">
                        Festival Year
                    </label>

                    <select id="festivalYear">

                        <option value="2026">
                            2026
                        </option>

                        <option value="2027">
                            2027
                        </option>

                        <option value="2028">
                            2028
                        </option>

                    </select>

                </div>


                <button
                    type="button"
                    id="migrateBtn"
                    class="btn-primary">

                    Publish Donations

                </button>


                <p id="message"></p>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="../js/migrate-donations.js">
    </script>
    <script type="module" src="../js/site.js"></script>

</body>

</html>
