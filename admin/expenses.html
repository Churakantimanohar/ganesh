<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Expense - Reddy's Youth Associations</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">

            <div class="logo">
                <img class="brand-logo" src="../assets/logo.svg" alt="Reddy's Youth Associations logo">
                <span>Reddy's Youth Associations</span>
            </div>

            <div class="nav-links">
                <a href="dashboard.html">Admin Dashboard</a>
                <a href="expenses.html">Add Expense</a>
                <a href="manage-expenses.html">Manage Expenses</a>
                <a href="manage-donations.html">Manage Donations</a>
                <a href="../expenses.html">View Expenses</a>
                <a href="#" id="logoutBtn">Logout</a>
            </div>

        </div>
    </nav>


    <!-- Main Content -->
    <main class="dashboard-container">

        <section class="dashboard-header">
            <h1>Add Festival Expense</h1>

            <p>
                Record a new expense for the Ganapathi festival.
            </p>
        </section>


        <!-- Expense Form -->
        <section class="dashboard-section">

            <div class="form-card">

                <form id="expenseForm">

                    <!-- Expense Name -->
                    <div class="form-group">

                        <label for="expenseName">
                            Expense Name
                        </label>

                        <input
                            type="text"
                            id="expenseName"
                            placeholder="Example: Decoration"
                            required
                        >

                    </div>


                    <!-- Category -->
                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select id="category" required>

                            <option value="">
                                Select Category
                            </option>

                            <option value="Decoration">
                                Decoration
                            </option>

                            <option value="Food">
                                Food
                            </option>

                            <option value="Sound">
                                Sound
                            </option>

                            <option value="Lighting">
                                Lighting
                            </option>

                            <option value="Pooja">
                                Pooja Materials
                            </option>

                            <option value="Transportation">
                                Transportation
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Amount -->
                    <div class="form-group">

                        <label for="amount">
                            Amount (₹)
                        </label>

                        <input
                            type="number"
                            id="amount"
                            placeholder="Enter amount"
                            min="1"
                            step="0.01"
                            required
                        >

                    </div>


                    <!-- Description -->
                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            rows="4"
                            placeholder="Enter expense details"
                        ></textarea>

                    </div>


                    <!-- Festival Year -->
                    <div class="form-group">

                        <label for="festivalYear">
                            Festival Year
                        </label>

                        <select id="festivalYear" required>

                            <option value="2026">
                                2026
                            </option>

                            <option value="2027">
                                2027
                            </option>

                            <option value="2028">
                                2028
                            </option>

                        </select>

                    </div>


                    <!-- Date -->
                    <div class="form-group">

                        <label for="expenseDate">
                            Expense Date
                        </label>

                        <input
                            type="date"
                            id="expenseDate"
                            required
                        >

                    </div>


                    <!-- Submit -->
                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Add Expense
                    </button>

                    <p id="message"></p>

                </form>

            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script
        type="module"
        src="../js/admin-expenses.js">
    </script>
    <script type="module" src="../js/site.js"></script>

</body>
</html>
