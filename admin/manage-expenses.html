
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Expenses - Ganapathi Transparency</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            Ganapathi Transparency
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="expenses.html">
                Add Expense
            </a>

            <a href="manage-expenses.html">
                Manage Expenses
            </a>

            <a href="../expenses.html">
                Public Expenses
            </a>

            <a href="#" id="logoutBtn">
                Logout
            </a>

        </div>

    </nav>


    <!-- Main -->
    <main class="dashboard-container">

        <!-- Header -->
        <section class="dashboard-header">

            <h1>
                Manage Expenses
            </h1>

            <p>
                View, edit and delete festival expenses.
            </p>

        </section>


        <!-- Controls -->
        <section class="dashboard-section">

            <div class="expense-controls">

                <div>

                    <label for="festivalYear">
                        Festival Year
                    </label>

                    <select id="festivalYear">

                        <option value="2026">
                            2026
                        </option>

                        <option value="2027">
                            2027
                        </option>

                        <option value="2028">
                            2028
                        </option>

                    </select>

                </div>


                <div class="expense-total-box">

                    <span>
                        Total Expenses
                    </span>

                    <strong id="totalExpenses">
                        ₹0
                    </strong>

                </div>

            </div>

        </section>


        <!-- Expense Table -->
        <section class="dashboard-section">

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Date
                            </th>

                            <th>
                                Expense
                            </th>

                            <th>
                                Category
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Description
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>

                    <tbody id="expenseTableBody">

                        <tr>

                            <td colspan="6">
                                Loading expenses...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Edit Modal -->
    <div
        id="editModal"
        class="modal"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2>
                    Edit Expense
                </h2>

                <button
                    type="button"
                    id="closeModal"
                    class="close-button"
                >
                    ×
                </button>

            </div>


            <form id="editExpenseForm">

                <input
                    type="hidden"
                    id="editExpenseId"
                >


                <div class="form-group">

                    <label for="editExpenseName">
                        Expense Name
                    </label>

                    <input
                        type="text"
                        id="editExpenseName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="editCategory">
                        Category
                    </label>

                    <select
                        id="editCategory"
                        required
                    >

                        <option value="Decoration">
                            Decoration
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Sound">
                            Sound
                        </option>

                        <option value="Lighting">
                            Lighting
                        </option>

                        <option value="Pooja">
                            Pooja Materials
                        </option>

                        <option value="Transportation">
                            Transportation
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="editAmount">
                        Amount (₹)
                    </label>

                    <input
                        type="number"
                        id="editAmount"
                        min="1"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="editDescription">
                        Description
                    </label>

                    <textarea
                        id="editDescription"
                        rows="4"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="editDate">
                        Expense Date
                    </label>

                    <input
                        type="date"
                        id="editDate"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-primary"
                >
                    Save Changes
                </button>

                <p id="editMessage"></p>

            </form>

        </div>

    </div>


    <!-- JavaScript -->
    <script
        type="module"
        src="../js/manage-expenses.js">
    </script>

</body>

</html>
