<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Ganapathi Transparency</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="auth-container">

        <h1>🕉️ Ganapathi Festival</h1>

        <h2>Login</h2>


        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                required
            >


            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p id="loginMessage"></p>


        <p>
            Don't have an account?

            <a href="register.html">
                Create Account
            </a>
        </p>


        <p>
            <a href="index.html">
                ← Back to Home
            </a>
        </p>

    </div>


    <!-- JavaScript -->

    <script
        type="module"
        src="js/auth.js">
    </script>

</body>

</html>
