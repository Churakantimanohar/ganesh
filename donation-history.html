<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Donations - Ganapathi Festival</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">
            <img class="brand-logo" src="assets/logo.svg" alt="Reddy's Youth Associations logo">
            <span>Reddy's Youth Associations</span>
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="dashboard.html">Dashboard</a>

            <a href="donations.html">Donate</a>

            <a href="transparency.html">Transparency</a>

            <button id="logoutButton" class="nav-button">
                Logout
            </button>

        </nav>

    </header>


    <main class="donation-history-page">

        <section class="page-header">

            <h1>💰 My Donations</h1>

            <p>
                View your contribution history.
            </p>

        </section>


        <!-- Total Donation -->

        <section class="my-donation-summary">

            <div class="summary-card">

                <h3>
                    Total You Donated
                </h3>

                <p id="myTotalDonations">
                    ₹0
                </p>

            </div>

        </section>


        <!-- Donation Table -->

        <section class="donation-table-section">

            <h2>
                Donation History
            </h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Date
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Payment Method
                            </th>

                            <th>
                                Festival
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <tbody id="donationTableBody">

                        <tr>

                            <td colspan="5">
                                Loading donations...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Reddy's Youth Associations
        </p>

    </footer>


    <script
        type="module"
        src="js/donation-history.js">
    </script>
    <script type="module" src="js/site.js"></script>

</body>

</html>
